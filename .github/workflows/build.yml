name: APK Guard — Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP (if present)
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP topildi: $ZIP_FILE"
            mkdir -p _extracted
            unzip -o "$ZIP_FILE" -d _extracted
            INNER=$(ls _extracted | head -1)
            if [ -d "_extracted/$INNER" ] && [ -f "_extracted/$INNER/settings.gradle.kts" ]; then
              echo "PROJECT_DIR=_extracted/$INNER" >> $GITHUB_ENV
            elif [ -f "_extracted/settings.gradle.kts" ]; then
              echo "PROJECT_DIR=_extracted" >> $GITHUB_ENV
            else
              echo "PROJECT_DIR=." >> $GITHUB_ENV
            fi
          else
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > "$PROJECT_DIR/local.properties"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cd "$PROJECT_DIR"
          mkdir -p apk_output
          find . -name "*.apk" -not -path "*/intermediates/*" | while read f; do
            cp "$f" apk_output/
          done
          ls -lh apk_output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKGuard-debug
          path: ${{ env.PROJECT_DIR }}/apk_output/*.apk
          if-no-files-found: error
          retention-days: 30
